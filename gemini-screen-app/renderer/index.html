<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Gemini Screen Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- タイトルバー -->
        <div class="titlebar">
            <div class="titlebar-title">✨ Gemini Screen Explainer</div>
            <div class="titlebar-buttons">
                <button class="titlebar-btn" id="minimizeBtn">─</button>
                <button class="titlebar-btn close" id="closeBtn">✕</button>
            </div>
        </div>

        <div class="container">
            <!-- 設定セクション -->
            <details id="settingsDetails" class="settings-details">
                <summary>⚙️ 設定</summary>
                <div class="settings-content">
                    <div class="settings-row">
                        <label>API キー:</label>
                        <div class="input-group">
                            <input type="password" id="apiKey" placeholder="Gemini APIキーを入力...">
                            <button id="saveApiKeyBtn" class="btn btn-small">保存</button>
                        </div>
                    </div>
                    <div class="settings-row">
                        <label>モデル:</label>
                        <select id="modelSelect">
                            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <label>ショートカット:</label>
                        <div class="input-group">
                            <input type="text" id="shortcutInput" placeholder="Alt+Shift+S">
                            <button id="saveShortcutBtn" class="btn btn-small">設定</button>
                        </div>
                    </div>
                    <div class="hint">
                        <a href="https://aistudio.google.com/app/apikey" id="apiKeyLink">🔑 APIキーを取得</a>
                    </div>
                </div>
            </details>

            <!-- キャプチャボタン -->
            <div class="section">
                <button id="captureBtn" class="btn btn-primary btn-large">
                    📸 画面をキャプチャ
                </button>
                <div class="shortcut-hint">
                    <span id="shortcutDisplay">Alt+Shift+S</span> でどこからでもキャプチャ
                </div>
            </div>

            <!-- プレビュー -->
            <div id="previewSection" class="section hidden">
                <div class="preview">
                    <img id="previewImage" alt="Screenshot">
                </div>
            </div>

            <!-- ローディング -->
            <div id="loadingSection" class="section hidden">
                <div class="loader"></div>
                <p>Geminiが解析中...</p>
            </div>

            <!-- チャット -->
            <div id="chatSection" class="section hidden">
                <div id="chatMessages" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="質問を入力...">
                    <button id="sendBtn" class="btn btn-primary">送信</button>
                </div>
            </div>

            <!-- リセット -->
            <div id="resetSection" class="section hidden">
                <button id="resetBtn" class="btn btn-secondary">
                    🔄 新しいスクリーンショット
                </button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
