<!DOCTYPE html>
<html>
<head>
    <title>Icon Generator</title>
</head>
<body>
    <h1>アイコン生成ツール</h1>
    <p>各ボタンをクリックしてアイコンをダウンロードしてください。</p>

    <canvas id="canvas"></canvas>

    <div>
        <button onclick="generateIcon(16)">16x16をダウンロード</button>
        <button onclick="generateIcon(48)">48x48をダウンロード</button>
        <button onclick="generateIcon(128)">128x128をダウンロード</button>
    </div>

    <script>
        function generateIcon(size) {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = size;
            canvas.height = size;

            // グラデーション背景
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#4285f4');
            gradient.addColorStop(1, '#9b59b6');

            // 角丸四角形
            const radius = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(radius, 0);
            ctx.lineTo(size - radius, 0);
            ctx.quadraticCurveTo(size, 0, size, radius);
            ctx.lineTo(size, size - radius);
            ctx.quadraticCurveTo(size, size, size - radius, size);
            ctx.lineTo(radius, size);
            ctx.quadraticCurveTo(0, size, 0, size - radius);
            ctx.lineTo(0, radius);
            ctx.quadraticCurveTo(0, 0, radius, 0);
            ctx.fillStyle = gradient;
            ctx.fill();

            // スクリーン
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = size * 0.05;
            const screenX = size * 0.2;
            const screenY = size * 0.25;
            const screenW = size * 0.6;
            const screenH = size * 0.45;
            ctx.strokeRect(screenX, screenY, screenW, screenH);

            // カメラ円
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(size * 0.5, size * 0.47, size * 0.12, 0, Math.PI * 2);
            ctx.fill();

            // 中心点
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(size * 0.5, size * 0.47, size * 0.06, 0, Math.PI * 2);
            ctx.fill();

            // キラキラ
            if (size >= 48) {
                ctx.fillStyle = '#fff';
                drawStar(ctx, size * 0.8, size * 0.2, size * 0.08);
            }

            // ダウンロード
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        function drawStar(ctx, x, y, r) {
            ctx.beginPath();
            ctx.moveTo(x, y - r);
            ctx.lineTo(x + r * 0.3, y - r * 0.3);
            ctx.lineTo(x + r, y);
            ctx.lineTo(x + r * 0.3, y + r * 0.3);
            ctx.lineTo(x, y + r);
            ctx.lineTo(x - r * 0.3, y + r * 0.3);
            ctx.lineTo(x - r, y);
            ctx.lineTo(x - r * 0.3, y - r * 0.3);
            ctx.closePath();
            ctx.fill();
        }
    </script>
</body>
</html>
