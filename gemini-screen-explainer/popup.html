<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Screen Explainer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>✨ Gemini Screen Explainer</h1>
        </header>

        <!-- 設定セクション -->
        <div id="settingsSection" class="section">
            <div class="settings-row">
                <label for="apiKey">API キー:</label>
                <div class="api-key-input">
                    <input type="password" id="apiKey" placeholder="APIキーを入力...">
                    <button id="saveApiKey" class="btn btn-small">保存</button>
                </div>
            </div>
            <div class="settings-row">
                <label for="modelSelect">モデル:</label>
                <select id="modelSelect">
                    <option value="gemini-2.5-flash-preview-05-20">Gemini 2.5 Flash (推奨)</option>
                    <option value="gemini-2.5-pro-preview-06-05">Gemini 2.5 Pro</option>
                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash</option>
                </select>
            </div>
            <div class="settings-row hint-row">
                <a href="https://aistudio.google.com/app/apikey" target="_blank">🔑 APIキーを取得</a>
                <span class="separator">|</span>
                <a href="#" id="shortcutLink">⌨️ ショートカット設定</a>
            </div>
            <div id="currentShortcut" class="current-shortcut"></div>
        </div>

        <!-- スクリーンショット -->
        <div id="screenshotSection" class="section">
            <button id="captureBtn" class="btn btn-primary btn-large">
                📸 画面をキャプチャ
            </button>
            <div id="screenshotPreview" class="preview hidden">
                <img id="previewImage" alt="Screenshot preview">
            </div>
        </div>

        <!-- ローディング -->
        <div id="loadingSection" class="section hidden">
            <div class="loader"></div>
            <p>Geminiが画面を解析中...</p>
        </div>

        <!-- チャット -->
        <div id="chatSection" class="section hidden">
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="質問を入力...">
                <button id="sendBtn" class="btn btn-primary">送信</button>
            </div>
        </div>

        <!-- リセット -->
        <div id="resetSection" class="section hidden">
            <button id="resetBtn" class="btn btn-secondary">
                🔄 新しいスクリーンショット
            </button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
