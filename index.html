<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロゴ作成ツール</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ロゴ作成ツール</h1>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="control-section">
                    <h3>テキスト</h3>
                    <div class="control-group">
                        <label for="logoText">テキスト:</label>
                        <input type="text" id="logoText" value="ロゴ" placeholder="テキストを入力">
                    </div>
                    <div class="control-group">
                        <label for="fontSize">フォントサイズ:</label>
                        <input type="range" id="fontSize" min="12" max="120" value="48">
                        <span id="fontSizeValue">48px</span>
                    </div>
                    <div class="control-group">
                        <label for="fontFamily">フォント:</label>
                        <select id="fontFamily">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Impact">Impact</option>
                        </select>
                    </div>
                    <div class="control-group">
                        <label for="textColor">テキスト色:</label>
                        <input type="color" id="textColor" value="#000000">
                    </div>
                    <div class="control-group">
                        <label for="textX">X位置:</label>
                        <input type="range" id="textX" min="0" max="800" value="400">
                    </div>
                    <div class="control-group">
                        <label for="textY">Y位置:</label>
                        <input type="range" id="textY" min="0" max="600" value="300">
                    </div>
                </div>

                <div class="control-section">
                    <h3>背景</h3>
                    <div class="control-group">
                        <label for="bgColor">背景色:</label>
                        <input type="color" id="bgColor" value="#ffffff">
                    </div>
                    <div class="control-group">
                        <label>
                            <input type="checkbox" id="transparentBg">
                            透明背景
                        </label>
                    </div>
                </div>

                <div class="control-section">
                    <h3>図形を追加</h3>
                    <div class="button-group">
                        <button id="addCircle" class="btn">円を追加</button>
                        <button id="addRectangle" class="btn">四角を追加</button>
                    </div>
                    <div class="control-group">
                        <label for="shapeColor">図形の色:</label>
                        <input type="color" id="shapeColor" value="#ff0000">
                    </div>
                </div>

                <div class="control-section">
                    <h3>エクスポート</h3>
                    <div class="button-group">
                        <button id="downloadPNG" class="btn btn-primary">PNG としてダウンロード</button>
                        <button id="clearCanvas" class="btn btn-secondary">クリア</button>
                    </div>
                </div>
            </aside>

            <main class="canvas-area">
                <canvas id="logoCanvas" width="800" height="600"></canvas>
            </main>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
